<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Handle &amp; Hue Favicon">
  <!-- Warm Ivory rounded square background with thin Champagne Gold border -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#FAF6F0" stroke="#C9A66B" stroke-width="1.8" />
  <!-- Subtle Blush Pink inner arch motif -->
  <path d="M16 50 V28 C16 18, 48 18, 48 28 V50" fill="#F4D9D0" fill-opacity="0.45" />
  <!-- Minimalist Bag Handle Silhouette at top -->
  <path d="M24 20 C24 11, 40 11, 40 20" fill="none" stroke="#C9A66B" stroke-width="1.6" stroke-linecap="round" />
  <!-- Monogram H & H -->
  <text x="32" y="43" text-anchor="middle" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="23" font-weight="600" fill="#2B2B2B" letter-spacing="0.04em">
    H<tspan font-style="italic" font-weight="400" fill="#C9A66B" font-size="21">&amp;</tspan>H
  </text>
</svg>
