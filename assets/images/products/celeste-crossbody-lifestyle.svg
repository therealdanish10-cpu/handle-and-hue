<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900" role="img" aria-label="The Céleste Pleated Crossbody">
  <!-- REPLACE WITH REAL STUDIO PRODUCT PHOTO: Swap this SVG path in js/products.js with your 800x900 .jpg or .webp product image -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="55%" stop-color="#F5EFE4"/>
      <stop offset="100%" stop-color="#EFE5DC"/>
    </linearGradient>
    <linearGradient id="bagBody" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#D4B47B"/>
      <stop offset="65%" stop-color="#C29E5F"/>
      <stop offset="100%" stop-color="#A98649"/>
    </linearGradient>
    <linearGradient id="bagAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C29E5F"/>
      <stop offset="100%" stop-color="#A98649"/>
    </linearGradient>
    <linearGradient id="bagShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A98649"/>
      <stop offset="100%" stop-color="#2B2B2B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6CFA1"/>
      <stop offset="45%" stop-color="#C9A66B"/>
      <stop offset="100%" stop-color="#9A7840"/>
    </linearGradient>
  </defs>
  <rect width="800" height="900" fill="url(#bgGrad)"/>
  
      <rect x="90" y="80" width="620" height="720" rx="310" fill="#F4D9D0" fill-opacity="0.35"/>
      <line x1="80" y1="665" x2="720" y2="665" stroke="#C9A66B" stroke-width="1" stroke-opacity="0.4"/>
      <text x="400" y="130" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="22" fill="#2B2B2B" fill-opacity="0.65">Atelier Edition — Carry your color</text>
    
  <ellipse cx="400" cy="652" rx="170" ry="18" fill="#2B2B2B" fill-opacity="0.12"/>
  <g transform="translate(0, 20) scale(0.92)">
    <g >
        <!-- Long Gold Chain & Strap -->
        <path d="M245 410 C195 160, 605 160, 555 410" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-dasharray="8 4"/>
        <path d="M310 220 Q400 185 490 220" fill="none" stroke="url(#bagAccent)" stroke-width="14" stroke-linecap="round"/>
        <!-- Soft Cloud Pleated Body -->
        <path d="M225 430 C215 375, 260 345, 400 345 C540 345, 585 375, 575 430 L560 585 C555 622, 520 642, 475 642 L325 642 C280 642, 245 622, 240 585 Z" fill="url(#bagBody)" stroke="#C9A66B" stroke-width="1.2" stroke-opacity="0.45"/>
        <!-- Pleat Lines -->
        <path d="M310 350 Q290 490 320 638" fill="none" stroke="url(#bagShadow)" stroke-width="2" stroke-opacity="0.45"/>
        <path d="M365 346 Q358 490 370 640" fill="none" stroke="url(#bagShadow)" stroke-width="2" stroke-opacity="0.4"/>
        <path d="M435 346 Q442 490 430 640" fill="none" stroke="url(#bagShadow)" stroke-width="2" stroke-opacity="0.4"/>
        <path d="M490 350 Q510 490 480 638" fill="none" stroke="url(#bagShadow)" stroke-width="2" stroke-opacity="0.45"/>
        <!-- Gold Side D-Rings & Center Bar -->
        <rect x="360" y="340" width="80" height="12" rx="6" fill="url(#goldGrad)"/>
        <text x="400" y="598" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="10" letter-spacing="0.28em" fill="#FAF6F0">HANDLE &amp; HUE</text>
      </g>
  </g>
</svg>