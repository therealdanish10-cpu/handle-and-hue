<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900" role="img" aria-label="The Margaux Knot Mini Handbag">
  <!-- REPLACE WITH REAL STUDIO PRODUCT PHOTO: Swap this SVG path in js/products.js with your 800x900 .jpg or .webp product image -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="55%" stop-color="#F6EFF0"/>
      <stop offset="100%" stop-color="#EFE5DC"/>
    </linearGradient>
    <linearGradient id="bagBody" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#D4B5B8"/>
      <stop offset="65%" stop-color="#C29DA1"/>
      <stop offset="100%" stop-color="#AC8489"/>
    </linearGradient>
    <linearGradient id="bagAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C29DA1"/>
      <stop offset="100%" stop-color="#AC8489"/>
    </linearGradient>
    <linearGradient id="bagShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#AC8489"/>
      <stop offset="100%" stop-color="#2B2B2B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6CFA1"/>
      <stop offset="45%" stop-color="#C9A66B"/>
      <stop offset="100%" stop-color="#9A7840"/>
    </linearGradient>
  </defs>
  <rect width="800" height="900" fill="url(#bgGrad)"/>
  
      <circle cx="400" cy="440" r="290" fill="#F4D9D0" fill-opacity="0.28" stroke="#C9A66B" stroke-width="1" stroke-dasharray="6 4"/>
      <text x="400" y="120" text-anchor="middle" font-family="'Jost', sans-serif" font-size="13" letter-spacing="0.3em" fill="#C9A66B">ARTISANAL HARDWARE &amp; FULL-GRAIN CALFSKIN</text>
    
  <ellipse cx="400" cy="652" rx="170" ry="18" fill="#2B2B2B" fill-opacity="0.12"/>
  <g transform="translate(-260, -210) scale(1.65)">
    <g >
        <!-- Sculptural Crescent Hobo Silhouette -->
        <path d="M265 245 C245 185, 555 185, 535 245 C585 360, 585 595, 510 635 C455 660, 345 660, 290 635 C215 595, 215 360, 265 245 Z" fill="url(#bagBody)" stroke="#C9A66B" stroke-width="1.2" stroke-opacity="0.45"/>
        <!-- Inner Cutout of Hobo Handle -->
        <path d="M310 265 C310 215, 490 215, 490 265 C505 345, 470 395, 400 395 C330 395, 295 345, 310 265 Z" fill="url(#bgGrad)" stroke="#C9A66B" stroke-width="1" stroke-opacity="0.4"/>
        <!-- Artisan Knotted Cuffs & Gold End-Caps -->
        <ellipse cx="285" cy="285" rx="26" ry="16" fill="url(#bagAccent)" stroke="#C9A66B" stroke-width="1"/>
        <ellipse cx="515" cy="285" rx="26" ry="16" fill="url(#bagAccent)" stroke="#C9A66B" stroke-width="1"/>
        <rect x="266" y="298" width="38" height="10" rx="4" fill="url(#goldGrad)"/>
        <rect x="496" y="298" width="38" height="10" rx="4" fill="url(#goldGrad)"/>
        <text x="400" y="555" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="11" letter-spacing="0.28em" fill="#FAF6F0">HANDLE &amp; HUE</text>
      </g>
  </g>
</svg>