<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900" role="img" aria-label="The Séraphine Arch Handbag">
  <!-- REPLACE WITH REAL STUDIO PRODUCT PHOTO: Swap this SVG path in js/products.js with your 800x900 .jpg or .webp product image -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="55%" stop-color="#F3ECE2"/>
      <stop offset="100%" stop-color="#EFE5DC"/>
    </linearGradient>
    <linearGradient id="bagBody" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#F7F1E5"/>
      <stop offset="65%" stop-color="#EAE0CE"/>
      <stop offset="100%" stop-color="#D8CCB6"/>
    </linearGradient>
    <linearGradient id="bagAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAE0CE"/>
      <stop offset="100%" stop-color="#D8CCB6"/>
    </linearGradient>
    <linearGradient id="bagShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D8CCB6"/>
      <stop offset="100%" stop-color="#2B2B2B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6CFA1"/>
      <stop offset="45%" stop-color="#C9A66B"/>
      <stop offset="100%" stop-color="#9A7840"/>
    </linearGradient>
  </defs>
  <rect width="800" height="900" fill="url(#bgGrad)"/>
  
      <path d="M160 720 L160 220 C160 110, 640 110, 640 220 L640 720 Z" fill="#F4D9D0" fill-opacity="0.32" stroke="#C9A66B" stroke-width="1" stroke-opacity="0.35"/>
      <circle cx="590" cy="210" r="65" fill="#C9A66B" fill-opacity="0.12"/>
      <!-- Travertine Pedestal Block -->
      <path d="M170 640 L630 640 L660 730 L140 730 Z" fill="#EFE7DC" stroke="#C9A66B" stroke-width="0.8" stroke-opacity="0.4"/>
      <rect x="140" y="730" width="520" height="45" fill="#E4D9C8"/>
    
  <ellipse cx="400" cy="652" rx="170" ry="18" fill="#2B2B2B" fill-opacity="0.12"/>
  <g >
    <g transform="translate(25, -8) rotate(-4 400 450) scale(1.03)">
        <!-- Sculptural Arch Handle -->
        <path d="M295 360 C295 165, 505 165, 505 360" fill="none" stroke="url(#bagAccent)" stroke-width="22" stroke-linecap="round"/>
        <!-- Gold Rings -->
        <circle cx="295" cy="355" r="16" fill="none" stroke="url(#goldGrad)" stroke-width="6"/>
        <circle cx="505" cy="355" r="16" fill="none" stroke="url(#goldGrad)" stroke-width="6"/>
        <!-- Dome Body -->
        <path d="M235 610 C225 400, 275 305, 400 305 C525 305, 575 400, 565 610 C563 632, 544 646, 520 646 L280 646 C256 646, 237 632, 235 610 Z" fill="url(#bagBody)" stroke="#C9A66B" stroke-width="1.2" stroke-opacity="0.4"/>
        <!-- Curved Flap -->
        <path d="M258 370 Q400 475 542 370" fill="none" stroke="url(#bagShadow)" stroke-width="2.5"/>
        <path d="M262 365 Q400 468 538 365" fill="none" stroke="#C9A66B" stroke-width="0.9" stroke-dasharray="4 3" stroke-opacity="0.65"/>
        <!-- Clasp -->
        <circle cx="400" cy="422" r="18" fill="url(#goldGrad)"/>
        <circle cx="400" cy="422" r="7" fill="#FAF6F0"/>
        <text x="400" y="595" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="11" letter-spacing="0.28em" fill="#C9A66B">HANDLE &amp; HUE</text>
      </g>
  </g>
</svg>