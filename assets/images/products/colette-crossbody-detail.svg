<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900" role="img" aria-label="The Colette Bucket Crossbody">
  <!-- REPLACE WITH REAL STUDIO PRODUCT PHOTO: Swap this SVG path in js/products.js with your 800x900 .jpg or .webp product image -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="55%" stop-color="#F1EAE0"/>
      <stop offset="100%" stop-color="#EFE5DC"/>
    </linearGradient>
    <linearGradient id="bagBody" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#F5EFE2"/>
      <stop offset="65%" stop-color="#E6DCC8"/>
      <stop offset="100%" stop-color="#D1C4AC"/>
    </linearGradient>
    <linearGradient id="bagAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6DCC8"/>
      <stop offset="100%" stop-color="#D1C4AC"/>
    </linearGradient>
    <linearGradient id="bagShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D1C4AC"/>
      <stop offset="100%" stop-color="#2B2B2B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6CFA1"/>
      <stop offset="45%" stop-color="#C9A66B"/>
      <stop offset="100%" stop-color="#9A7840"/>
    </linearGradient>
  </defs>
  <rect width="800" height="900" fill="url(#bgGrad)"/>
  
      <circle cx="400" cy="440" r="290" fill="#F4D9D0" fill-opacity="0.28" stroke="#C9A66B" stroke-width="1" stroke-dasharray="6 4"/>
      <text x="400" y="120" text-anchor="middle" font-family="'Jost', sans-serif" font-size="13" letter-spacing="0.3em" fill="#C9A66B">ARTISANAL HARDWARE &amp; FULL-GRAIN CALFSKIN</text>
    
  <ellipse cx="400" cy="652" rx="170" ry="18" fill="#2B2B2B" fill-opacity="0.12"/>
  <g transform="translate(-260, -210) scale(1.65)">
    <g >
        <!-- Arching Shoulder Handle -->
        <path d="M270 305 C270 155, 530 155, 530 305" fill="none" stroke="url(#bagAccent)" stroke-width="15" stroke-linecap="round"/>
        <!-- Contrast Blush Suede Interior Peek -->
        <ellipse cx="400" cy="305" rx="135" ry="26" fill="#F4D9D0" stroke="#C9A66B" stroke-width="1"/>
        <!-- Cylindrical Bucket Body -->
        <path d="M265 305 L535 305 L515 605 C512 634, 465 650, 400 650 C335 650, 288 634, 285 605 Z" fill="url(#bagBody)" stroke="#C9A66B" stroke-width="1.2" stroke-opacity="0.5"/>
        <!-- Gold Cinch Band -->
        <path d="M270 355 Q400 378 530 355" fill="none" stroke="url(#goldGrad)" stroke-width="5"/>
        <rect x="382" y="352" width="36" height="22" rx="6" fill="url(#goldGrad)"/>
        <text x="400" y="595" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="11" letter-spacing="0.28em" fill="#C9A66B">HANDLE &amp; HUE</text>
      </g>
  </g>
</svg>