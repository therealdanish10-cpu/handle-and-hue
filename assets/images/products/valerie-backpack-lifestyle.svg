<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900" role="img" aria-label="The Valérie City Backpack">
  <!-- REPLACE WITH REAL STUDIO PRODUCT PHOTO: Swap this SVG path in js/products.js with your 800x900 .jpg or .webp product image -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="55%" stop-color="#F2ECE4"/>
      <stop offset="100%" stop-color="#EFE5DC"/>
    </linearGradient>
    <linearGradient id="bagBody" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#333130"/>
      <stop offset="65%" stop-color="#242221"/>
      <stop offset="100%" stop-color="#181615"/>
    </linearGradient>
    <linearGradient id="bagAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242221"/>
      <stop offset="100%" stop-color="#181615"/>
    </linearGradient>
    <linearGradient id="bagShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181615"/>
      <stop offset="100%" stop-color="#2B2B2B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6CFA1"/>
      <stop offset="45%" stop-color="#C9A66B"/>
      <stop offset="100%" stop-color="#9A7840"/>
    </linearGradient>
  </defs>
  <rect width="800" height="900" fill="url(#bgGrad)"/>
  
      <rect x="90" y="80" width="620" height="720" rx="310" fill="#F4D9D0" fill-opacity="0.35"/>
      <line x1="80" y1="665" x2="720" y2="665" stroke="#C9A66B" stroke-width="1" stroke-opacity="0.4"/>
      <text x="400" y="130" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="22" fill="#2B2B2B" fill-opacity="0.65">Atelier Edition — Carry your color</text>
    
  <ellipse cx="400" cy="652" rx="170" ry="18" fill="#2B2B2B" fill-opacity="0.12"/>
  <g transform="translate(0, 20) scale(0.92)">
    <g >
        <!-- Top Rolled Handle -->
        <path d="M345 255 C345 190, 455 190, 455 255" fill="none" stroke="url(#bagBody)" stroke-width="15" stroke-linecap="round"/>
        <circle cx="345" cy="255" r="8" fill="url(#goldGrad)"/>
        <circle cx="455" cy="255" r="8" fill="url(#goldGrad)"/>
        <!-- Shoulder Straps Hint -->
        <path d="M265 320 C220 420, 220 550, 255 620" fill="none" stroke="url(#bagAccent)" stroke-width="14" stroke-linecap="round"/>
        <path d="M535 320 C580 420, 580 550, 545 620" fill="none" stroke="url(#bagAccent)" stroke-width="14" stroke-linecap="round"/>
        <!-- Structured Backpack Body -->
        <path d="M265 280 C265 260, 285 250, 310 250 L490 250 C515 250, 535 260, 535 280 L555 605 C555 632, 535 648, 505 648 L295 648 C265 648, 245 632, 245 605 Z" fill="url(#bagBody)" stroke="#C9A66B" stroke-width="1.2" stroke-opacity="0.5"/>
        <!-- Top Flap -->
        <path d="M268 272 L532 272 L515 415 C512 435, 490 448, 465 448 L335 448 C310 448, 288 435, 285 415 Z" fill="url(#bagAccent)" stroke="#C9A66B" stroke-width="1" stroke-opacity="0.6"/>
        <!-- Vertical Strap & Gold Clasp -->
        <rect x="386" y="365" width="28" height="125" rx="6" fill="url(#bagBody)" stroke="#C9A66B" stroke-width="0.9"/>
        <rect x="378" y="432" width="44" height="32" rx="6" fill="url(#goldGrad)"/>
        <!-- Front Zip Pocket -->
        <rect x="295" y="515" width="210" height="90" rx="12" fill="url(#bagAccent)" stroke="#C9A66B" stroke-width="0.9" stroke-opacity="0.5"/>
        <line x1="315" y1="535" x2="485" y2="535" stroke="url(#goldGrad)" stroke-width="2.5"/>
      </g>
  </g>
</svg>