<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900" role="img" aria-label="The Vivienne Box Clutch">
  <!-- REPLACE WITH REAL STUDIO PRODUCT PHOTO: Swap this SVG path in js/products.js with your 800x900 .jpg or .webp product image -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="55%" stop-color="#F6F1E6"/>
      <stop offset="100%" stop-color="#EFE5DC"/>
    </linearGradient>
    <linearGradient id="bagBody" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#CEAF75"/>
      <stop offset="65%" stop-color="#B99658"/>
      <stop offset="100%" stop-color="#9E7D42"/>
    </linearGradient>
    <linearGradient id="bagAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B99658"/>
      <stop offset="100%" stop-color="#9E7D42"/>
    </linearGradient>
    <linearGradient id="bagShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9E7D42"/>
      <stop offset="100%" stop-color="#2B2B2B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6CFA1"/>
      <stop offset="45%" stop-color="#C9A66B"/>
      <stop offset="100%" stop-color="#9A7840"/>
    </linearGradient>
  </defs>
  <rect width="800" height="900" fill="url(#bgGrad)"/>
  
      <path d="M160 720 L160 220 C160 110, 640 110, 640 220 L640 720 Z" fill="#F4D9D0" fill-opacity="0.32" stroke="#C9A66B" stroke-width="1" stroke-opacity="0.35"/>
      <circle cx="590" cy="210" r="65" fill="#C9A66B" fill-opacity="0.12"/>
      <!-- Travertine Pedestal Block -->
      <path d="M170 640 L630 640 L660 730 L140 730 Z" fill="#EFE7DC" stroke="#C9A66B" stroke-width="0.8" stroke-opacity="0.4"/>
      <rect x="140" y="730" width="520" height="45" fill="#E4D9C8"/>
    
  <ellipse cx="400" cy="652" rx="170" ry="18" fill="#2B2B2B" fill-opacity="0.12"/>
  <g >
    <g transform="translate(25, -8) rotate(-4 400 450) scale(1.03)">
        <!-- Delicate Chain -->
        <path d="M275 410 C310 250, 490 250, 525 410" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-dasharray="6 4"/>
        <!-- Geometric Hard-Shell Minaudiere Frame -->
        <rect x="215" y="395" width="370" height="215" rx="28" fill="url(#bagBody)" stroke="url(#goldGrad)" stroke-width="4"/>
        <rect x="232" y="412" width="336" height="181" rx="18" fill="none" stroke="#FAF6F0" stroke-width="0.9" stroke-opacity="0.5"/>
        <!-- Spherical Champagne Gold Kiss-Lock -->
        <circle cx="384" cy="382" r="14" fill="url(#goldGrad)"/>
        <circle cx="416" cy="382" r="14" fill="url(#goldGrad)"/>
        <rect x="365" y="392" width="70" height="10" rx="4" fill="url(#goldGrad)"/>
        <text x="400" y="512" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="12" letter-spacing="0.32em" fill="#FAF6F0">HANDLE &amp; HUE</text>
      </g>
  </g>
</svg>