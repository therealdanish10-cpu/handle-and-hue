<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900" role="img" aria-label="The Lumière Evening Clutch">
  <!-- REPLACE WITH REAL STUDIO PRODUCT PHOTO: Swap this SVG path in js/products.js with your 800x900 .jpg or .webp product image -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="55%" stop-color="#F8F1EC"/>
      <stop offset="100%" stop-color="#EFE5DC"/>
    </linearGradient>
    <linearGradient id="bagBody" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#F2D2C7"/>
      <stop offset="65%" stop-color="#E4BCAE"/>
      <stop offset="100%" stop-color="#CE9F90"/>
    </linearGradient>
    <linearGradient id="bagAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4BCAE"/>
      <stop offset="100%" stop-color="#CE9F90"/>
    </linearGradient>
    <linearGradient id="bagShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CE9F90"/>
      <stop offset="100%" stop-color="#2B2B2B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6CFA1"/>
      <stop offset="45%" stop-color="#C9A66B"/>
      <stop offset="100%" stop-color="#9A7840"/>
    </linearGradient>
  </defs>
  <rect width="800" height="900" fill="url(#bgGrad)"/>
  
      <rect x="90" y="80" width="620" height="720" rx="310" fill="#F4D9D0" fill-opacity="0.35"/>
      <line x1="80" y1="665" x2="720" y2="665" stroke="#C9A66B" stroke-width="1" stroke-opacity="0.4"/>
      <text x="400" y="130" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="22" fill="#2B2B2B" fill-opacity="0.65">Atelier Edition — Carry your color</text>
    
  <ellipse cx="400" cy="652" rx="170" ry="18" fill="#2B2B2B" fill-opacity="0.12"/>
  <g transform="translate(0, 20) scale(0.92)">
    <g >
        <!-- Detachable Fine Chain tucked cleanly -->
        <path d="M260 395 C300 280, 500 280, 540 395" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="5 3" stroke-opacity="0.8"/>
        <!-- Sleek Envelope Clutch Body -->
        <rect x="205" y="380" width="390" height="235" rx="18" fill="url(#bagBody)" stroke="#C9A66B" stroke-width="1.4" stroke-opacity="0.55"/>
        <!-- Angled Envelope Flap -->
        <path d="M207 392 L400 520 L593 392 C590 384, 582 380, 574 380 L226 380 C218 380, 210 384, 207 392 Z" fill="url(#bagAccent)" stroke="#C9A66B" stroke-width="1"/>
        <!-- Sculptural Champagne Gold Bar Clasp -->
        <rect x="335" y="506" width="130" height="16" rx="8" fill="url(#goldGrad)"/>
        <circle cx="400" cy="514" r="5" fill="#FAF6F0"/>
        <text x="400" y="575" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="11" letter-spacing="0.3em" fill="#C9A66B">HANDLE &amp; HUE</text>
      </g>
  </g>
</svg>