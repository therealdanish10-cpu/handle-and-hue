<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900" role="img" aria-label="The Delphine Atelier Work Tote">
  <!-- REPLACE WITH REAL STUDIO PRODUCT PHOTO: Swap this SVG path in js/products.js with your 800x900 .jpg or .webp product image -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="55%" stop-color="#F3EDE6"/>
      <stop offset="100%" stop-color="#EFE5DC"/>
    </linearGradient>
    <linearGradient id="bagBody" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#2E2C2B"/>
      <stop offset="65%" stop-color="#1F1E1D"/>
      <stop offset="100%" stop-color="#141312"/>
    </linearGradient>
    <linearGradient id="bagAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1E1D"/>
      <stop offset="100%" stop-color="#141312"/>
    </linearGradient>
    <linearGradient id="bagShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141312"/>
      <stop offset="100%" stop-color="#2B2B2B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6CFA1"/>
      <stop offset="45%" stop-color="#C9A66B"/>
      <stop offset="100%" stop-color="#9A7840"/>
    </linearGradient>
  </defs>
  <rect width="800" height="900" fill="url(#bgGrad)"/>
  
      <path d="M160 720 L160 220 C160 110, 640 110, 640 220 L640 720 Z" fill="#F4D9D0" fill-opacity="0.32" stroke="#C9A66B" stroke-width="1" stroke-opacity="0.35"/>
      <circle cx="590" cy="210" r="65" fill="#C9A66B" fill-opacity="0.12"/>
      <!-- Travertine Pedestal Block -->
      <path d="M170 640 L630 640 L660 730 L140 730 Z" fill="#EFE7DC" stroke="#C9A66B" stroke-width="0.8" stroke-opacity="0.4"/>
      <rect x="140" y="730" width="520" height="45" fill="#E4D9C8"/>
    
  <ellipse cx="400" cy="652" rx="170" ry="18" fill="#2B2B2B" fill-opacity="0.12"/>
  <g >
    <g transform="translate(25, -8) rotate(-4 400 450) scale(1.03)">
        <!-- Tall Commuter Handles -->
        <path d="M305 290 C305 140, 495 140, 495 290" fill="none" stroke="url(#bagBody)" stroke-width="16" stroke-linecap="round"/>
        <!-- Architectural Structured Work Tote -->
        <path d="M220 285 L580 285 L560 630 C558 642, 546 650, 532 650 L268 650 C254 650, 242 642, 240 630 Z" fill="url(#bagBody)" stroke="#C9A66B" stroke-width="1.4" stroke-opacity="0.6"/>
        <!-- Architectural Front Panel Seam -->
        <rect x="285" y="285" width="230" height="365" fill="url(#bagAccent)" stroke="#C9A66B" stroke-width="0.9" stroke-opacity="0.45"/>
        <!-- Gold Bar Hardware -->
        <rect x="295" y="278" width="22" height="14" rx="3" fill="url(#goldGrad)"/>
        <rect x="483" y="278" width="22" height="14" rx="3" fill="url(#goldGrad)"/>
        <circle cx="400" cy="340" r="10" fill="url(#goldGrad)"/>
        <text x="400" y="380" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="11" letter-spacing="0.28em" fill="#C9A66B">HANDLE &amp; HUE</text>
      </g>
  </g>
</svg>